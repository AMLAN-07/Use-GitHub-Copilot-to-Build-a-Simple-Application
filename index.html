<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple todo list that stays in your browser." />
    <title>Daylist | Todo app</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-labelledby="page-title">
        <header class="hero">
          <div>
            <p class="eyebrow">Your daily reset</p>
            <h1 id="page-title">Make space<br /><span>for what matters.</span></h1>
          </div>
          <div class="sun-mark" aria-hidden="true">✦</div>
        </header>

        <form class="add-form" id="add-form">
          <label class="sr-only" for="todo-input">What needs to get done?</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            maxlength="120"
            placeholder="What needs to get done?"
            autocomplete="off"
            required
          />
          <button class="add-button" type="submit" aria-label="Add todo">+</button>
        </form>

        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filter todos">
            <button class="filter-button is-active" type="button" data-filter="all">All</button>
            <button class="filter-button" type="button" data-filter="active">Open</button>
            <button class="filter-button" type="button" data-filter="completed">Done</button>
          </div>
          <button class="clear-button" id="clear-completed" type="button">Clear done</button>
        </div>

        <div class="todo-list" id="todo-list" aria-live="polite"></div>

        <footer class="list-footer">
          <p id="todo-count">0 tasks left</p>
          <p class="storage-note"><span class="status-dot"></span>Saved in this browser</p>
        </footer>
      </section>
      <p class="page-note">A little progress, every day.</p>
    </main>
  </body>
</html>
